<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Lunar Leap</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: one centered 5:3 game screen, short key legend under it, thumb pad only on touch screens. Single deliberate dark look. */
:root {
  --bg: #060818;
  --panel: #0e1330;
  --fg: #e7ecff;
  --muted: #8e98c4;
  --amber: #ffc933;
  --cyan: #3ec9ff;
  --coral: #ff5d73;
  --display: "Silkscreen", "Courier New", monospace;
  --body: "Chakra Petch", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 15px;
  padding-block: 20px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-height: 100%;
  display: flex;
  justify-content: center;
}
.wrap { width: 100%; max-width: 960px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--display); font-size: 22px; letter-spacing: 0.12em; margin: 0; color: var(--amber); text-transform: uppercase; }
.sub { color: var(--muted); font-size: 13px; letter-spacing: 0.04em; }
.screen { position: relative; border: 3px solid #1d2559; border-radius: 6px; background: #000; line-height: 0; box-shadow: 0 0 0 1px #0a0e2a, 0 18px 50px rgba(62,201,255,0.08); }
canvas { width: 100%; height: auto; aspect-ratio: 5 / 3; image-rendering: pixelated; touch-action: none; display: block; max-width: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; color: var(--muted); font-size: 13px; }
.legend b { font-family: var(--display); font-weight: 400; color: var(--fg); background: var(--panel); border: 1px solid #232c63; border-radius: 3px; padding: 2px 6px; margin-right: 6px; font-size: 11px; }
.pad { display: none; justify-content: space-between; align-items: center; gap: 12px; user-select: none; -webkit-user-select: none; }
.pad .grp { display: flex; gap: 10px; }
.pad button { font-family: var(--display); font-size: 15px; color: var(--fg); background: var(--panel); border: 2px solid #2a3480; border-radius: 8px; width: 68px; height: 62px; touch-action: none; }
.pad button.big { width: 104px; color: var(--bg); background: var(--amber); border-color: #ffe08a; }
.pad button.on { transform: translateY(2px); filter: brightness(1.25); }
button:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }
@media (pointer: coarse), (max-width: 640px) { .pad { display: flex; } }
@media (max-width: 480px) { h1 { font-size: 18px; } .pad button { width: 58px; height: 58px; } .pad button.big { width: 88px; } }
</style>

<div class="wrap">
  <header>
    <h1>Lunar Leap</h1>
    <span class="sub">Sector MOON-1 &middot; reach the beacon</span>
  </header>
  <div class="screen"><canvas id="c" width="800" height="480" aria-label="Lunar Leap game screen"></canvas></div>
  <div class="legend">
    <span><b>&larr; &rarr;</b>or A / D move</span>
    <span><b>SPACE</b>or W / &uarr; jump (hold for higher)</span>
    <span><b>SHIFT</b>boost</span>
    <span><b>M</b>sound</span>
  </div>
  <div class="pad" id="pad">
    <div class="grp"><button data-k="left" aria-label="Move left">&larr;</button><button data-k="right" aria-label="Move right">&rarr;</button></div>
    <div class="grp"><button data-k="run" aria-label="Boost">RUN</button><button data-k="jump" class="big" aria-label="Jump">JUMP</button></div>
  </div>
</div>

<script>
(() => {
const T = 32, W = 800, H = 480, COLS = 150, ROWS = 15;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const FD = 'Silkscreen, "Courier New", monospace';

/* ---------- audio ---------- */
let ac = null, muted = false;
function beep(f1, f2, dur, type = 'square', vol = 0.05, delay = 0) {
  if (!ac || muted) return;
  const t0 = ac.currentTime + delay;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f1, t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t0 + dur);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
let noiseBuf = null;
function noise(dur, vol, f1, f2) {
  if (!ac || muted) return;
  if (!noiseBuf) { noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
  const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 0.9;
  const t0 = ac.currentTime; f.frequency.setValueAtTime(f1, t0); f.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
  const g = ac.createGain(); g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  s.connect(f); f.connect(g); g.connect(ac.destination); s.start(t0); s.stop(t0 + dur + 0.02);
}
/* background music: soft space arpeggio, plays only while running */
const NOTE = m => 440 * Math.pow(2, (m - 69) / 12);
const CH = [[57, [0, 3, 7]], [53, [0, 4, 7]], [60, [0, 4, 7]], [55, [0, 4, 7]]];
let nextT = 0, mstep = 0;
function music() {
  if (!ac || muted || state !== 'play' || (p && p.dead)) { nextT = 0; return; }
  const now = ac.currentTime; if (nextT < now) nextT = now + 0.05;
  while (nextT < now + 0.3) {
    const ch = CH[Math.floor(mstep / 8) % 4], k = mstep % 8, idx = [0, 1, 2, 1, 0, 2, 1, 2][k];
    const note = ch[0] + 12 + ch[1][idx] + (k === 4 ? 12 : 0), d = nextT - now;
    beep(NOTE(note), NOTE(note), 0.18, 'triangle', 0.035, d);
    if (k % 4 === 0) beep(NOTE(ch[0] - 12), NOTE(ch[0] - 12), 0.3, 'square', 0.022, d);
    nextT += 0.2; mstep++;
  }
}
const sfx = {
  land: k => { beep(150, 50, 0.12, 'triangle', Math.min(0.1, 0.04 + k / 6000)); noise(0.18, 0.06, 1800, 300); },
  step: () => beep(110 + Math.random() * 30, 60, 0.05, 'triangle', 0.035),
  jump: () => { beep(300, 700, 0.16); noise(0.3, 0.08, 400, 2600); },
  coin: () => { beep(988, 988, 0.07); beep(1319, 1319, 0.16, 'square', 0.05, 0.07); },
  stomp: () => beep(260, 70, 0.14, 'triangle', 0.09),
  bump: () => beep(140, 90, 0.08, 'triangle', 0.09),
  brick: () => beep(200, 40, 0.18, 'sawtooth', 0.05),
  die: () => { beep(520, 90, 0.7, 'sawtooth', 0.06); },
  win: () => [523, 659, 784, 1047, 1319].forEach((f, i) => beep(f, f, 0.18, 'square', 0.05, i * 0.12)),
};

/* ---------- input ---------- */
const keys = {}, touch = {};
addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  keys[e.code] = true;
  if (e.code === 'KeyM') muted = !muted;
  if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowUp') pressStart();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; for (const k in touch) touch[k] = false; });
document.querySelectorAll('#pad button').forEach(b => {
  const k = b.dataset.k;
  const down = e => { e.preventDefault(); touch[k] = true; b.classList.add('on'); pressStart(); };
  const up = e => { e.preventDefault(); touch[k] = false; b.classList.remove('on'); };
  b.addEventListener('pointerdown', down);
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(n => b.addEventListener(n, up));
});
cv.addEventListener('pointerdown', () => pressStart());
function pressStart() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } }
  if (ac && ac.state === 'suspended') ac.resume();
  if (state === 'title') { state = 'play'; }
  else if (state === 'over' || state === 'win') { if (stateT > 0.8) { newGame(); state = 'play'; } }
}

/* ---------- world ---------- */
let map, coins, enemies, pops, parts, bumps;
let state = 'title', stateT = 0, score = 0, coinCount = 0, lives = 3, timeLeft = 300, cam = 0, spawn, p, best = 0;
const FLAG = 146 * T;

function build() {
  map = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
  const set = (x, y, t) => { if (x >= 0 && x < COLS && y >= 0 && y < ROWS) map[y][x] = t; };
  const row = (x, y, n, t) => { for (let i = 0; i < n; i++) set(x + i, y, t); };
  [[0, 24], [27, 45], [49, 70], [74, 80], [84, 110], [114, 130], [134, 149]].forEach(([a, b]) => { row(a, 13, b - a + 1, 1); row(a, 14, b - a + 1, 1); });
  // blocks: 1 rock, 2 brick, 3 ? block, 4 used, 5 metal
  set(8, 9, 3); set(20, 9, 3); row(31, 9, 2, 2); set(33, 9, 3); row(34, 9, 2, 2); set(40, 9, 3);
  row(14, 10, 3, 5);
  set(52, 9, 3); row(55, 9, 3, 2); set(58, 9, 3);
  row(60, 10, 4, 5); row(64, 7, 4, 5);
  row(76, 10, 3, 5); row(88, 10, 3, 5); row(93, 8, 3, 5); row(98, 10, 3, 5);
  set(104, 9, 3); row(105, 9, 3, 2);
  row(116, 10, 3, 5); row(120, 7, 3, 5); row(124, 10, 3, 5); set(127, 9, 3);
  for (let i = 0; i < 5; i++) for (let j = 0; j <= i; j++) set(137 + i, 12 - j, 1);

  coins = [];
  const coin = (x, y) => coins.push({ x: x * T + 16, y: y * T + 16, got: false, t: Math.random() * 6 });
  const arc = (x0, n, yb) => { for (let i = 0; i < n; i++) coin(x0 + i, yb - Math.sin(i / (n - 1) * Math.PI) * 2.6); };
  const line = (x, y, n) => { for (let i = 0; i < n; i++) coin(x + i, y); };
  [[23, 5, 12], [44, 6, 12], [68, 6, 12], [79, 6, 12], [108, 6, 12], [128, 6, 12]].forEach(a => arc(...a));
  line(14, 9, 3); line(64, 6, 4); line(93, 7, 3); line(120, 6, 3); line(88, 9, 3); line(98, 9, 3); line(116, 9, 3);
  line(36, 12, 3); line(60, 9, 4); line(95, 12, 4); line(131, 12, 1); line(124, 9, 3);

  enemies = [];
  [17, 29, 38, 53, 58, 66, 86, 91, 100, 106, 118, 123].forEach((x, i) => enemies.push({ t: 'w', x: x * T, y: 13 * T - 22, w: 26, h: 22, vx: i % 2 ? 45 : -45, alive: true, sq: 0 }));
  [[40, 8], [76, 7], [90, 6], [111, 8], [126, 5]].forEach(([x, y]) => enemies.push({ t: 'f', x0: x * T, x: x * T, by: y * T, y: y * T, w: 32, h: 20, ph: Math.random() * 6, alive: true, sq: 0 }));

  pops = []; parts = []; bumps = {};
  spawn = { x: 64, y: 380 };
}
function mkPlayer() { return { x: spawn.x, y: spawn.y, w: 22, h: 30, vx: 0, vy: 0, face: 1, onGround: false, coyote: 0, jbuf: 0, dead: false, deadT: 0, inv: 1.2, anim: 0, prevJump: false }; }
function newGame() { score = 0; coinCount = 0; lives = 3; timeLeft = 300; build(); p = mkPlayer(); cam = 0; stateT = 0; }
function respawn() { timeLeft = Math.max(timeLeft, 150); p = mkPlayer(); cam = Math.max(0, Math.min(spawn.x - W * 0.4, COLS * T - W)); }

const tile = (tx, ty) => (tx < 0 || tx >= COLS) ? 1 : (ty < 0 || ty >= ROWS) ? 0 : map[ty][tx];
const solidAt = (px, py) => tile(Math.floor(px / T), Math.floor(py / T)) > 0;

function spark(x, y, n, cols, spd = 160) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, s = (0.3 + Math.random()) * spd;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 80, life: 0.5 + Math.random() * 0.4, max: 0.9, c: cols[i % cols.length], s: 3 + Math.random() * 3 });
  }
}
function exhaust(n, big) {
  const bx = p.x + 11 - p.face * 10.5, by = p.y + 24;
  for (let i = 0; i < n; i++) parts.push({ x: bx + (Math.random() - 0.5) * 4, y: by, vx: (Math.random() - 0.5) * 40, vy: 140 + Math.random() * 120, g: -20, life: 0.18 + Math.random() * 0.2, max: 0.38, c: ['#ffc933', '#ff8a2a', '#fff2b0'][i % 3], s: big ? 4 : 3 });
}
function landFx(impact) {
  sfx.land(impact);
  const k = Math.min(1, impact / 600), fx = p.x + 11, fy = p.y + p.h;
  for (let i = 0; i < 8 + k * 8; i++) { const d = i % 2 ? 1 : -1; parts.push({ x: fx + d * 4, y: fy - 2, vx: d * (60 + Math.random() * 140 * (0.5 + k)), vy: -(10 + Math.random() * 50), g: 120, life: 0.35 + Math.random() * 0.3, max: 0.65, c: ['#aeb9d6', '#7f8db0', '#d3defa'][i % 3], s: 4 + Math.random() * 4 }); }
  for (let i = 0; i < 6; i++) parts.push({ x: fx + (Math.random() - 0.5) * 10, y: fy - 1, vx: (Math.random() - 0.5) * 220, vy: -(20 + Math.random() * 40), g: 300, life: 0.18 + Math.random() * 0.12, max: 0.3, c: ['#ffc933', '#ff8a2a', '#fff2b0'][i % 3], s: 3 });
}
function addScore(n, x, y) { score += n; pops.push({ x, y, txt: '+' + n, life: 0.8 }); }

function bump(tx, ty) {
  const t = map[ty][tx];
  bumps[tx + ',' + ty] = 0.16;
  if (t === 3) {
    map[ty][tx] = 4; coinCount++; addScore(100, tx * T + 16, ty * T - 6);
    spark(tx * T + 16, ty * T, 10, ['#ffc933', '#fff2b0']); sfx.coin();
  } else if (t === 2) {
    map[ty][tx] = 0; score += 50; spark(tx * T + 16, ty * T + 16, 14, ['#b3563b', '#7a3a28', '#e08a62']); sfx.brick();
  } else sfx.bump();
  enemies.forEach(e => { if (e.alive && Math.abs(e.x + e.w / 2 - (tx * T + 16)) < 26 && Math.abs(e.y + e.h - ty * T) < 8) kill(e); });
}
function kill(e) { e.alive = false; e.sq = 0.45; addScore(200, e.x + e.w / 2, e.y - 6); }
function die() {
  if (p.dead) return;
  p.dead = true; p.deadT = 0; p.vy = -520; p.vx = 0; sfx.die();
}

/* ---------- update ---------- */
function updatePlay(dt) {
  timeLeft -= dt;
  if (timeLeft <= 0 && !p.dead) { timeLeft = 0; die(); }

  if (p.dead) {
    p.deadT += dt; p.vy += 1500 * dt; p.y += p.vy * dt;
    if (p.deadT > 1.5) { lives--; if (lives <= 0) { state = 'over'; stateT = 0; best = Math.max(best, score); } else respawn(); }
  } else {
    const L = keys.ArrowLeft || keys.KeyA || touch.left, R = keys.ArrowRight || keys.KeyD || touch.right;
    const J = keys.Space || keys.ArrowUp || keys.KeyW || touch.jump;
    const run = keys.ShiftLeft || keys.ShiftRight || touch.run;
    const dir = (R ? 1 : 0) - (L ? 1 : 0);
    const maxV = run ? 290 : 205;
    const acc = p.onGround ? 1900 : 1000;
    if (dir) { p.vx += dir * acc * dt; p.vx = Math.max(-maxV, Math.min(maxV, p.vx)); p.face = dir; }
    else { const f = (p.onGround ? 1600 : 380) * dt; p.vx = Math.abs(p.vx) <= f ? 0 : p.vx - Math.sign(p.vx) * f; }
    if (dir && Math.sign(p.vx) !== dir && p.onGround) p.vx += dir * 1400 * dt; // quick turn

    p.coyote = p.onGround ? 0.1 : p.coyote - dt;
    if (J && !p.prevJump) p.jbuf = 0.11; else p.jbuf -= dt;
    p.prevJump = !!J;
    if (p.jbuf > 0 && p.coyote > 0) { p.vy = -610; p.jbuf = 0; p.coyote = 0; p.onGround = false; sfx.jump(); spark(p.x + 11, p.y + 30, 5, ['#9aa6c4', '#5b6580'], 60); exhaust(8, true); }
    if (!J && p.vy < -220) p.vy = -220 + (p.vy + 220) * 0.0; // short hop
    p.vy += 1500 * (p.vy > 0 ? 1.15 : 1) * dt; if (p.vy > 700) p.vy = 700;

    // horizontal
    p.x += p.vx * dt;
    let top = Math.floor(p.y / T), bot = Math.floor((p.y + p.h - 1) / T);
    if (p.vx > 0) { const tx = Math.floor((p.x + p.w) / T); for (let ty = top; ty <= bot; ty++) if (tile(tx, ty) > 0) { p.x = tx * T - p.w; p.vx = 0; break; } }
    else if (p.vx < 0) { const tx = Math.floor(p.x / T); for (let ty = top; ty <= bot; ty++) if (tile(tx, ty) > 0) { p.x = (tx + 1) * T; p.vx = 0; break; } }
    // vertical
    const wasAir = !p.onGround, impact = p.vy;
    p.y += p.vy * dt; p.onGround = false;
    const l = Math.floor(p.x / T), r = Math.floor((p.x + p.w - 1) / T);
    if (p.vy > 0) {
      const ty = Math.floor((p.y + p.h) / T);
      for (let tx = l; tx <= r; tx++) if (tile(tx, ty) > 0) { p.y = ty * T - p.h; p.vy = 0; p.onGround = true; break; }
    } else if (p.vy < 0) {
      const ty = Math.floor(p.y / T), cx = Math.floor((p.x + p.w / 2) / T);
      let hit = -1;
      for (const tx of [cx, l, r]) if (tile(tx, ty) > 0) { hit = tx; break; }
      if (hit >= 0) { p.y = (ty + 1) * T; p.vy = 0; bump(hit, ty); }
    }
    if (p.onGround && wasAir && impact > 150) landFx(impact);
    if (!p.onGround && p.vy < -60 && Math.random() < 0.8) exhaust(2, true);
    else if (!p.onGround && p.vy > 0 && Math.random() < 0.25) exhaust(1, false);
    p.anim += Math.abs(p.vx) * dt * 0.06;
    const sph = Math.floor(p.anim * 3 / Math.PI);
    if (sph !== p.stepPh) { p.stepPh = sph; if (p.onGround && Math.abs(p.vx) > 60) sfx.step(); }
    p.inv = Math.max(0, p.inv - dt);
    if (p.y > H + 60) die();

    // coins
    coins.forEach(c => {
      if (!c.got && Math.abs(c.x - (p.x + 11)) < 20 && Math.abs(c.y - (p.y + 15)) < 24) {
        c.got = true; coinCount++; score += 50; sfx.coin(); spark(c.x, c.y, 6, ['#ffc933', '#fff2b0'], 120);
      }
    });
    // checkpoint
    if (p.x > 66 * T && spawn.x < 66 * T) { spawn = { x: 66 * T, y: 380 }; pops.push({ x: 66 * T + 16, y: 340, txt: 'CHECKPOINT', life: 1.4 }); sfx.coin(); }
    // goal
    if (p.x + p.w > FLAG + 10) {
      score += Math.floor(timeLeft) * 10; best = Math.max(best, score); state = 'win'; stateT = 0; sfx.win();
      spark(FLAG + 16, 300, 40, ['#3ec9ff', '#ffc933', '#ff5d73'], 260);
    }
  }

  // enemies
  enemies.forEach(e => {
    if (!e.alive) { e.sq -= dt; return; }
    if (e.t === 'w') {
      e.x += e.vx * dt;
      const fx = e.vx < 0 ? e.x - 1 : e.x + e.w + 1;
      if (solidAt(fx, e.y + e.h / 2) || !solidAt(fx, e.y + e.h + 4)) { e.vx *= -1; e.x += e.vx * dt * 2; }
    } else {
      e.ph += dt; e.x = e.x0 + Math.sin(e.ph * 0.9) * 90; e.y = e.by + Math.sin(e.ph * 2.1) * 18;
    }
    if (!p.dead && p.x < e.x + e.w && p.x + p.w > e.x && p.y < e.y + e.h && p.y + p.h > e.y) {
      if (p.vy > 60 && p.y + p.h - e.y < 18) { kill(e); p.vy = (keys.Space || keys.ArrowUp || keys.KeyW || touch.jump) ? -560 : -380; sfx.stomp(); spark(e.x + e.w / 2, e.y + e.h / 2, 10, ['#7dff8a', '#2fbf5a'], 140); }
      else if (p.inv <= 0) die();
    }
  });
  enemies = enemies.filter(e => e.alive || e.sq > 0);

  // fx
  parts.forEach(q => { q.life -= dt; q.vy += (q.g === undefined ? 700 : q.g) * dt; q.x += q.vx * dt; q.y += q.vy * dt; });
  parts = parts.filter(q => q.life > 0);
  pops.forEach(q => { q.life -= dt; q.y -= 40 * dt; });
  pops = pops.filter(q => q.life > 0);
  for (const k in bumps) { bumps[k] -= dt; if (bumps[k] <= 0) delete bumps[k]; }

  const target = Math.max(0, Math.min(p.x - W * 0.4, COLS * T - W));
  cam += (target - cam) * Math.min(1, dt * 8);
}

/* ---------- drawing ---------- */
const hash = (a, b) => { const n = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return n - Math.floor(n); };
const stars = [0.05, 0.14, 0.3].map((par, li) => ({ par, pts: Array.from({ length: 50 + li * 12 }, (_, i) => ({ x: hash(i, li) * W, y: hash(li, i + 9) * H * 0.85, s: li + 1, ph: hash(i, 3) * 6 })) }));

/* ---------- sectors: the backdrop changes as you travel ---------- */
const NAMES = ['MOON BASE', 'SPIRAL GALAXY', 'FROZEN WORLD', 'RED GIANT'];
let curScene = 0, bannerT = 0;
const lerp = (a, b, t) => a + (b - a) * t;
const mixc = (c1, c2, t) => `rgb(${lerp(c1[0], c2[0], t) | 0},${lerp(c1[1], c2[1], t) | 0},${lerp(c1[2], c2[2], t) | 0})`;
const SPIRAL = Array.from({ length: 460 }, (_, i) => { const r = Math.pow(hash(i, 5), 0.7) * 70; return { r, ang: r * 0.085 + (i % 2) * Math.PI + (hash(i, 8) - 0.5) * 0.7, s: hash(i, 2) > 0.8 ? 2 : 1, c: hash(i, 4) }; });

function planet(x, y, r, cols, band) {
  const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r);
  g.addColorStop(0, cols[0]); g.addColorStop(0.6, cols[1]); g.addColorStop(1, cols[2]);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
  if (band) {
    ctx.save(); ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.clip(); ctx.fillStyle = band;
    for (let i = -4; i <= 4; i += 2) ctx.fillRect(x - r, y + i * r * 0.2 - r * 0.05, r * 2, r * 0.12);
    ctx.restore();
  }
}
function ring(x, y, rx, ry, rot, col, w, front) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.strokeStyle = col; ctx.lineWidth = w;
  ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, front ? 0 : Math.PI, front ? Math.PI : 6.283); ctx.stroke(); ctx.restore();
}
function smudge(x, y, r, sq, rot, c) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(1, sq);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r); g.addColorStop(0, c); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(-r, -r, r * 2, r * 2); ctx.restore();
}
function spiral(cx, cy, sc, rot) {
  smudge(cx, cy, 70 * sc, 0.5, -0.4, 'rgba(255,230,190,0.5)');
  const base = ctx.globalAlpha;
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(-0.4);
  for (const q of SPIRAL) {
    const a = q.ang + rot;
    ctx.globalAlpha = base * Math.max(0.2, 0.95 - q.r / 100);
    ctx.fillStyle = q.r < 22 ? '#fff1c8' : (q.c > 0.5 ? '#9fc4ff' : '#d6a8ff');
    ctx.fillRect(Math.cos(a) * q.r * sc, Math.sin(a) * q.r * sc * 0.45, q.s, q.s);
  }

}
function blackHole(x, y, r) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(-0.25);
  ctx.save(); ctx.scale(1, 0.28);
  const g = ctx.createRadialGradient(0, 0, r * 0.8, 0, 0, r * 3.4);
  g.addColorStop(0, 'rgba(255,210,100,0.95)'); g.addColorStop(0.4, 'rgba(255,100,40,0.45)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(-r * 3.4, -r * 3.4, r * 6.8, r * 6.8); ctx.restore();

  ctx.strokeStyle = 'rgba(255,225,160,0.85)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, r + 2, 0, 6.283); ctx.stroke();
  ctx.restore();
}

function drawBackground() {
  const Z = (COLS * T - W) / 4, prog = Math.max(0, Math.min(3.999, cam / Z)), i = Math.floor(prog), fr = prog - i;
  const u = Math.max(0, (fr - 0.75) / 0.25), f = i < 3 ? u * u * (3 - 2 * u) : 0;
  const A = SC[i], B = SC[Math.min(3, i + 1)];
  const dom = f > 0.5 ? i + 1 : i;
  if (dom !== curScene) { curScene = dom; bannerT = 2.6; }
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, mixc(A.sky[0], B.sky[0], f)); g.addColorStop(0.6, mixc(A.sky[1], B.sky[1], f)); g.addColorStop(1, mixc(A.sky[2], B.sky[2], f));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const nb = (x, y, r, c) => { const rg = ctx.createRadialGradient(x, y, 0, x, y, r); rg.addColorStop(0, c); rg.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = rg; ctx.fillRect(x - r, y - r, r * 2, r * 2); };
  [[A, 1 - f], [B, f]].forEach(([s, a]) => { if (a <= 0.01) return; ctx.globalAlpha = a; s.neb.forEach(n => nb(n[0] - cam * 0.03 + (s === B ? 0 : 0), n[1], n[2], n[3])); });
  ctx.globalAlpha = 1;
  stars.forEach(l => l.pts.forEach(s => {
    const x = (((s.x - cam * l.par) % W) + W) % W;
    const a = 0.45 + 0.55 * Math.sin(clock * 1.5 + s.ph) * Math.sin(clock * 0.7 + s.ph * 2);
    ctx.globalAlpha = Math.max(0.15, Math.abs(a)); ctx.fillStyle = s.s === 3 ? '#cfe9ff' : '#ffffff';
    ctx.fillRect(Math.floor(x), Math.floor(s.y), s.s > 1 ? 2 : 1, s.s > 1 ? 2 : 1);
  }));
  // shooting star
  const sp = (clock % 6.5) / 0.7;
  if (sp < 1) { ctx.globalAlpha = 1 - sp; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.beginPath(); const sx = 640 - sp * 380, sy = 30 + sp * 170; ctx.moveTo(sx, sy); ctx.lineTo(sx + 46, sy - 24); ctx.stroke(); }
  ctx.globalAlpha = 1 - f; A.obj(cam - i * Z);
  if (f > 0.01) { ctx.globalAlpha = f; B.obj(cam - (i + 1) * Z); }
  ctx.globalAlpha = 1;
  // horizon ridges
  ctx.fillStyle = mixc(A.rid[0], B.rid[0], f); ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 8) { const wx = x + cam * 0.25; ctx.lineTo(x, 370 + Math.sin(wx * 0.011) * 22 + Math.sin(wx * 0.037) * 9); }
  ctx.lineTo(W, H); ctx.fill();
  ctx.fillStyle = mixc(A.rid[1], B.rid[1], f); ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 8) { const wx = x + cam * 0.5; ctx.lineTo(x, 396 + Math.sin(wx * 0.017 + 2) * 14 + Math.sin(wx * 0.05) * 5); }
  ctx.lineTo(W, H); ctx.fill();
}

function drawTiles() {
  const c0 = Math.floor(cam / T), c1 = Math.min(COLS - 1, c0 + Math.ceil(W / T) + 1);
  for (let ty = 0; ty < ROWS; ty++) for (let tx = c0; tx <= c1; tx++) {
    const t = map[ty][tx]; if (!t) continue;
    let x = Math.floor(tx * T - cam), y = ty * T;
    const bv = bumps[tx + ',' + ty]; if (bv) y -= Math.sin(bv / 0.16 * Math.PI) * 8;
    if (t === 1) {
      ctx.fillStyle = '#4f5878'; ctx.fillRect(x, y, T, T);
      ctx.fillStyle = '#434b69'; ctx.fillRect(x, y + T - 4, T, 4);
      const cr = hash(tx, ty);
      ctx.fillStyle = '#3a4160'; ctx.fillRect(x + 4 + cr * 14, y + 8 + hash(ty, tx) * 12, 8, 4); ctx.fillRect(x + 20 - cr * 8, y + 20, 5, 3);
      if (tile(tx, ty - 1) === 0) { ctx.fillStyle = '#a9b6d6'; ctx.fillRect(x, y, T, 6); ctx.fillStyle = '#7f8db0'; ctx.fillRect(x, y + 6, T, 3); }
      ctx.fillStyle = 'rgba(255,255,255,0.05)'; ctx.fillRect(x, y, 2, T);
    } else if (t === 2) {
      ctx.fillStyle = '#b3563b'; ctx.fillRect(x, y, T, T);
      ctx.fillStyle = '#7a3a28'; ctx.fillRect(x, y + 15, T, 2); ctx.fillRect(x + 15, y, 2, 15); ctx.fillRect(x + 7, y + 17, 2, 15); ctx.fillRect(x + 23, y + 17, 2, 15);
      ctx.fillStyle = '#e08a62'; ctx.fillRect(x, y, T, 2); ctx.fillRect(x, y + 17, T, 2);
    } else if (t === 3) {
      const pulse = 0.5 + 0.5 * Math.sin(clock * 4 + tx);
      ctx.fillStyle = `rgba(255,201,51,${0.12 + pulse * 0.12})`; ctx.fillRect(x - 4, y - 4, T + 8, T + 8);
      ctx.fillStyle = '#ffc933'; ctx.fillRect(x, y, T, T);
      ctx.fillStyle = '#fff2b0'; ctx.fillRect(x, y, T, 3); ctx.fillRect(x, y, 3, T);
      ctx.fillStyle = '#c98a10'; ctx.fillRect(x, y + T - 3, T, 3); ctx.fillRect(x + T - 3, y, 3, T);
      ctx.fillStyle = '#7a4a00'; ctx.font = `20px ${FD}`; ctx.textAlign = 'center'; ctx.fillText('?', x + 16, y + 24);
    } else if (t === 4) {
      ctx.fillStyle = '#4a4458'; ctx.fillRect(x, y, T, T); ctx.fillStyle = '#383349'; ctx.fillRect(x, y + T - 3, T, 3); ctx.fillRect(x + T - 3, y, 3, T);
      ctx.fillStyle = '#5d5770'; ctx.fillRect(x, y, T, 2);
    } else if (t === 5) {
      ctx.fillStyle = '#7d8aa8'; ctx.fillRect(x, y, T, T);
      ctx.fillStyle = '#d3defa'; ctx.fillRect(x, y, T, 4);
      ctx.fillStyle = '#5a6684'; ctx.fillRect(x, y + 20, T, 12);
      ctx.fillStyle = '#3ec9ff'; ctx.fillRect(x + 4, y + 10, 6, 3); ctx.fillRect(x + 22, y + 10, 6, 3);
      ctx.fillStyle = '#2d3652'; ctx.fillRect(x + 14, y + 8, 4, 4);
    }
  }
}

function drawCoin(c) {
  const x = Math.floor(c.x - cam); if (x < -20 || x > W + 20) return;
  const w = Math.abs(Math.cos(clock * 4 + c.t)) * 7 + 2;
  ctx.fillStyle = '#ffc933'; ctx.fillRect(Math.floor(x - w), Math.floor(c.y - 9 + Math.sin(clock * 2 + c.t) * 2), Math.floor(w * 2), 18);
  ctx.fillStyle = '#fff2b0'; ctx.fillRect(Math.floor(x - w), Math.floor(c.y - 9 + Math.sin(clock * 2 + c.t) * 2), Math.max(2, Math.floor(w * 0.6)), 18);
}

function drawEnemy(e) {
  const x = Math.floor(e.x - cam); if (x < -50 || x > W + 50) return;
  const y = Math.floor(e.y);
  if (!e.alive) { ctx.fillStyle = '#2fbf5a'; ctx.fillRect(x, y + e.h - 5, e.w, 5); return; }
  if (e.t === 'w') {
    const step = Math.floor(clock * 8) % 2;
    ctx.fillStyle = '#2fbf5a'; ctx.fillRect(x + 2, y + 4, 22, 14); ctx.fillRect(x + 5, y + 1, 16, 6);
    ctx.fillStyle = '#1f8a40'; ctx.fillRect(x + 2, y + 14, 22, 4);
    ctx.fillStyle = '#2fbf5a'; ctx.fillRect(x + 6, y - 5, 2, 7); ctx.fillRect(x + 18, y - 5, 2, 7);
    ctx.fillStyle = '#ff5d73'; ctx.fillRect(x + 5, y - 8, 4, 4); ctx.fillRect(x + 17, y - 8, 4, 4);
    ctx.fillStyle = '#fff'; ctx.fillRect(x + 6, y + 6, 6, 7); ctx.fillRect(x + 15, y + 6, 6, 7);
    ctx.fillStyle = '#111'; const d = e.vx < 0 ? 0 : 2; ctx.fillRect(x + 7 + d, y + 8, 3, 4); ctx.fillRect(x + 16 + d, y + 8, 3, 4);
    ctx.fillStyle = '#1f8a40'; ctx.fillRect(x + 4 + step * 6, y + 18, 6, 4); ctx.fillRect(x + 16 - step * 6, y + 18, 6, 4);
  } else {
    ctx.fillStyle = '#6a3fd0'; ctx.fillRect(x + 2, y + 8, 28, 8); ctx.fillRect(x + 8, y + 4, 16, 6);

    ctx.globalAlpha = 1;
    ctx.fillStyle = '#ffc933'; ctx.fillRect(x + 12, y + 16, 8, 3);
  }
}

function drawPlayer() {
  if (state === 'title' && 0) return;
  const x = Math.floor(p.x - cam), y = Math.floor(p.y), f = p.face;
  if (p.inv > 0 && !p.dead && Math.floor(clock * 20) % 2) return;

}

function draw() {
  drawBackground(); drawCheckpoint(); drawFlag(); drawTiles();
  coins.forEach(c => { if (!c.got) drawCoin(c); });
  enemies.forEach(drawEnemy);
  drawPlayer();
  parts.forEach(q => { ctx.globalAlpha = Math.max(0, q.life / q.max); ctx.fillStyle = q.c; ctx.fillRect(Math.floor(q.x - cam), Math.floor(q.y), q.s, q.s); });
  ctx.globalAlpha = 1;
  pops.forEach(q => text(q.txt, Math.floor(q.x - cam), Math.floor(q.y), 12, '#fff2b0'));
  drawHUD();
  if (bannerT > 0 && state === 'play') { ctx.globalAlpha = Math.min(1, bannerT); text('SECTOR: ' + NAMES[curScene], W / 2, 76, 16, '#3ec9ff'); ctx.globalAlpha = 1; }
  const blink = Math.floor(clock * 2) % 2 === 0;
  if (state === 'title') {
    overlay('LUNAR LEAP', ['Collect star coins. Stomp the aliens.', 'Reach the beacon before oxygen runs out.', blink ? 'PRESS SPACE OR TAP TO LAUNCH' : ' '], '#ffc933');
  } else if (state === 'over') {
    overlay('SIGNAL LOST', ['Score ' + score + '   Best ' + best, blink ? 'PRESS SPACE OR TAP TO RETRY' : ' '], '#ff5d73');
  } else if (state === 'win') {
    overlay('BEACON REACHED', ['Score ' + score + '   Coins ' + coinCount + '   Best ' + best, blink ? 'PRESS SPACE OR TAP TO FLY AGAIN' : ' '], '#3ec9ff');
  }
}

/* ---------- loop ---------- */
newGame();
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now; clock += dt; stateT += dt; bannerT = Math.max(0, bannerT - dt);
  music();
  if (state === 'play') updatePlay(dt);
  else {
    parts.forEach(q => { q.life -= dt; q.vy += 700 * dt; q.x += q.vx * dt; q.y += q.vy * dt; });
    parts = parts.filter(q => q.life > 0);
    if (state === 'title') { cam = (cam + dt * 40) % 600; }
  }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
if (document.fonts && document.fonts.load) document.fonts.load('16px Silkscreen').catch(() => {});
window.__g = { get state() { return state; }, get p() { return p; }, get score() { return score; }, get coins() { return coinCount; }, get lives() { return lives; } };
})();
</script>
